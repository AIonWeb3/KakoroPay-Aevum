[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
ffi = false
via_ir = false
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
fuzz = { runs = 256, seed = "0xdead" }
invariant = { runs = 256, depth = 50 }

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
aevum_testnet = "https://rpc-test.qday.info"

[etherscan]
aevum_testnet = { key = "any", url = "https://explorer-test.qday.info/api" }

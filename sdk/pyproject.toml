[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kakoro-sdk"
version = "0.1.0"
description = "Python client SDK for policy-bounded agent payments on QDay Aevum Testnet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KakoroPay Team" }]
dependencies = [
    "web3>=6.0.0",
    "eth-account>=0.10.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kakoro_sdk*"]
